[tool.poetry]
name = "imbalanced_project"
version = "0.1.0"
description = "This project is a project to learn how to handle imbalanced data and learn how to use poetry and a cookiecutter datascience template."
authors = ["Michael Roberts <mikey.rob2222gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = "1.26.4"
pandas = "2.1.4"
matplotlib = "3.7.1"
seaborn = "^0.13.2"
jupyter = "^1.0.0"
ipykernel = "^6.29.5"
imblearn = "^0.0"
joblib = "1.2.0"
plotly = "^5.24.0"
flask = "^3.0.3"
xgboost = "^2.1.2"
scikit-learn = "^1.4.0"
pycaret = "^3.3.2"
kaleido = "0.2.1"
lifelines = "^0.30.0"

[tool.poetry.dev-dependencies]
pytest = "^6.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
